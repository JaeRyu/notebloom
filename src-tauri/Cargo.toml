[package]
name = "notebloom"
version = "0.1.0"
description = "Notebloom - Google Drive 동기화 개인 노트 앱"
edition = "2021"

[lib]
# 모바일(Android/iOS) 빌드에는 staticlib/cdylib 가 필요하다.
name = "notebloom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
